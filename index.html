<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halo — Ai Matter Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app" id="app">

  <!-- ===== Ticket 33592 — Sidenav ===================================== -->
  <nav class="rail" aria-label="Main">
    <div class="rail__brand">
      <img src="assets/halo-logo.svg" alt="Halo" width="96" height="32">
    </div>
    <div class="rail__nav" id="rail-nav">
      <button class="icon-btn" id="rail-toggle" aria-label="Collapse navigation" aria-expanded="true">
        <span><img src="assets/icon-menu.svg" alt=""></span>
      </button>
      <!-- nav items are rendered by app.js so the collapse + groups stay in one place -->
    </div>
  </nav>

  <div class="main">

    <!-- ===== Ticket 33591 — Top nav ================================== -->
    <header class="topbar">
      <button class="searchbar" id="open-search" aria-label="Search Halo" aria-haspopup="dialog">
        <span class="searchbar__label" id="searchbar-label">Search Halo</span>
        <span class="searchbar__trailing">
          <span class="icon-btn"><span><img src="assets/icon-search.svg" alt=""></span></span>
        </span>
      </button>

      <div class="topbar__actions">
        <button class="icon-btn" aria-label="Help">
          <span><img src="assets/icon-help.svg" alt=""></span>
        </button>
        <button class="icon-btn" aria-label="Notifications">
          <span><img src="assets/icon-bell.svg" alt=""></span>
        </button>
        <button class="text-btn">Log out</button>
      </div>
    </header>

    <div class="tabs" id="tabs" role="tablist" aria-label="Open matters"></div>
    <div id="matter-strip"></div>

    <!-- ===== The workspace bed ======================================= -->
    <main class="workspace" id="workspace">
      <div class="columns" id="columns"></div>
      <div id="hero"></div>
    </main>

    <div id="toolbar-slot"></div>

    <!-- ===== Ask Halo ================================================ -->
    <div id="ask-slot"></div>
    <!-- The orb lives in the markup rather than being rendered, so the button
         keeps one WebGL context for the life of the page. Its `background`
         matches the frosted blue pill so no corner of the canvas shows. -->
    <button class="fab" id="ask-fab" hidden>
      <ai-orb class="orb" style="width:32px;height:32px" diameter="1" state="idle"
              background="#c6e8fe" gain="3.4" bloom="0" ink-level="1"
              time-offset="3.5"></ai-orb>
      Ask Halo
    </button>

  </div><!-- /.main -->
</div><!-- /.app -->

<!-- ===== Search overlay (Figma 5570:491832) ========================== -->
<div class="scrim" id="search-scrim" hidden>
  <div class="search-panel" role="dialog" aria-modal="true" aria-label="Search Halo">
    <div class="search-panel__wrapper">
      <div class="search-field">
        <span class="search-field__leading">
          <button class="icon-btn" id="search-back" aria-label="Close search">
            <span><img src="assets/icon-back.svg" alt=""></span>
          </button>
        </span>
        <input id="search-input" type="search" autocomplete="off" spellcheck="false"
               placeholder="Search matters, clients, references, addresses…"
               aria-controls="search-results" aria-autocomplete="list">
        <span class="search-field__trailing">
          <button class="icon-btn" id="search-clear" aria-label="Clear search">
            <span><img src="assets/icon-close.svg" alt=""></span>
          </button>
        </span>
      </div>
      <div class="search-tabs">
        <div class="search-tabs__tab" id="search-tab">Recent Matters</div>
      </div>
      <div class="search-results" id="search-results" role="listbox" aria-label="Matters"></div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="orb.js"></script>
<script src="workload.js"></script>
<script src="search.js"></script>
<script src="app.js"></script>
</body>
</html>
